<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>DarkFrame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #0b0b0f;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }
    header {
      background: #111;
      padding: 14px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #222;
    }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }
    .card {
      background: #151515;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,.4);
    }
    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
    }
    .title {
      margin: 10px 0;
      font-size: 18px;
    }
  </style>
</head>
<body>

<header>DarkFrame</header>

<div class="container">
  <div class="card">
    <div class="title">Kusuriya no Hitorigoto ตอนที่ 1</div>
    <video controls>
      <source src="https://a12.rukoluo.com/f/1/Kusuriya-no-Hitorigoto/Kusuriya-no-Hitorigoto-01-360.mp4">
    </video>
  </div>
</div>

</body>
</html>
