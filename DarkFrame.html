<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarkFrame</title>
</head>
<body style="margin:0">

<script>
  
    .img {
  width: 100%;
  max-width: 450px;
  display: block;
  margin: 0 auto;
}
    
   .anime-card {
  text-decoration: none;
}

.img-box {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
}

.img-box img {
  width: 100%;
  height: 230px;
  object-fit: cover;
  display: block;
}

.overlay-text {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;

  padding: 10px;
  font-size: 13px;
  line-height: 1.3;
  color: #fff;

  background: linear-gradient(
    to top,
    rgba(0,0,0,0.75),
    rgba(0,0,0,0.2),
    transparent
  );
}
    
    .anime-card:active {
  transform: scale(0.96);
}
    
    .anime-card,
.header {
  background: var(--bg-glass);
  backdrop-filter: blur(6px);
}
    
    body.dark .particle {
  box-shadow:
    0 0 12px rgba(150,200,255,1),
    0 0 25px rgba(120,180,255,0.8);
}
    
   .particle {
  position: fixed;
  bottom: -20px;          /* ⬅️ เริ่มจากล่างจอจริง */
  left: 0;

  width: 6px;
  height: 6px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 2;

  background: radial-gradient(circle,
    rgba(180,220,255,0.9),
    rgba(180,220,255,0.4),
    transparent
  );

  box-shadow:
    0 0 10px rgba(180,220,255,0.9),
    0 0 20px rgba(150,200,255,0.6);

  animation: particleUp linear forwards;
}

@keyframes particleUp {
  from {
    transform: translateY(0) scale(0.6);
    opacity: 0;
  }
  to {
    transform: translateY(-120vh) scale(1.4); /* ⬅️ ลอยไปสุดบน */
    opacity: 1;
  }
}
    
    /* ================= THEMES ================= */
:root {
  --bg-glass: rgba(255,255,255,0.75);
  --text: #333;
  --accent: #ff9acb;
}

body.cute {
  --bg-glass: rgba(255,255,255,0.75);
  --text: #444;
  --accent: #ffb6d5;
}

body.pink {
  --bg-glass: rgba(255,230,240,0.8);
  --text: #663344;
  --accent: #ff6fae;
}

/* ================= FLOAT ANIMATION ================= */
.floating {
  position: fixed;
  pointer-events: none;
  animation: floatUp linear infinite;
  opacity: 0.6;
}

@keyframes floatUp {
  from {
    transform: translateY(100vh) scale(0.8);
  }
  to {
    transform: translateY(-10vh) scale(1.2);
  }
}

/* ===== RESET ===== */
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    url("https://wallpapers.com/images/hd/street-crossing-aesthetic-anime-scenery-l83ai5pxcgb259mv.jpg")
    center / cover no-repeat fixed;
}

/* ===== HEADER ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 10;

  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(8px);

  padding: 14px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

.header h1 {
  margin: 0 0 10px;
  color: #444;
}

/* ช่องค้นหา */
.search {
  width: 90%;
  max-width: 400px;
  padding: 10px 14px;
  border-radius: 20px;
  border: 1px solid #ccc;
  outline: none;
  font-size: 15px;
}

/* ===== LIST ===== */
.anime-list {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}

/* ===== CARD ===== */
.anime-card {
  text-decoration: none;
  color: #333;

  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(6px);

  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);

  transition: transform 0.2s, box-shadow 0.2s;
}

.anime-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

.anime-card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.anime-card p {
  padding: 10px;
  font-size: 14px;
  text-align: center;
}

</style>
</head>
<body>
    
<div id="https://wallpapers.com/images/hd/street-crossing-aesthetic-anime-scenery-l83ai5pxcgb259mv.jpg"></div>

<header class="header">
  <h1>🎬 AnimeFume</h1>
  <input class="search" type="text" placeholder="ค้นหาอนิเมะ...">
</header>
<section class="anime-list">
    
<a href="index.html" class="anime-card"><img src="https://kusuriyanohitorigoto.jp/season1/gallery/img/keyvisual/02.jpg" class="img">
    <div class="overlay-text">
      Mizu Zokusei no Mahoutsukai<br>
      ตอนที่ 1 ซับไทย (ตัวอย่าง)
    </div>
  </div>
</a>
<script>
function goAnime(card) {
  const url = card.querySelector("span").dataset.link;
  window.open(url, "_blank");
}
</script>
 
<script>
    
    
const bg = document.getElementById("bg");

window.addEventListener("scroll", () => {
  bg.style.transform = `translateY(${window.scrollY * 0.18}px)`;
});

/* ===== BLUE PARTICLE EFFECT ===== */
function spawnParticle() {
  const p = document.createElement("div");
  p.className = "particle";

  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDuration = (6 + Math.random() * 6) + "s";
  p.style.width = p.style.height = (4 + Math.random() * 6) + "px";

  document.body.appendChild(p);

  setTimeout(() => p.remove(), 12000);
}

/* ความถี่ (ยิ่งมากยิ่งฟุ้ง) */
setInterval(spawnParticle, 350);
</script>

</body>
</html>
